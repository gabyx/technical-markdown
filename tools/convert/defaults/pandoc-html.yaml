to: html5

template: includes/html/template.html
css: css/main.css
highlight-style: tango

html-math-method:
  method: mathjax
  url: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

include-in-header:
  [
    "includes/html/scroll-into-view.html",
    "includes/html/anchors.html",
    "includes/html/side-nav.html",
  ]
variables:
  include-before-partials: "includes/html/template-sidebar.html"

number-sections: true

standalone: true
self-contained: false

cite-method: citeproc
html-q-tags: true

eol: lf
